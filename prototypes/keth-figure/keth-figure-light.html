<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Keth figure</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(780px,100% - 32px);margin:64px auto 96px}
</style><style>
.keth-control{display:grid;gap:6px;margin:10px auto 0;max-width:420px}
.keth-label{font:10.5px var(--anatomy-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--anatomy-muted)}
.keth-range input{width:100%;accent-color:var(--anatomy-strong);margin:0}
.keth-ticks{display:flex;justify-content:space-between;font:10.5px var(--anatomy-mono);color:var(--anatomy-muted);padding:0 6px}

const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
	const a = azimuth * RADIANS;
	const e = elevation * RADIANS;
	return {
		sinA: Math.sin(a),
		cosA: Math.cos(a),
		sinE: Math.sin(e),
		cosE: Math.cos(e),
		k: scale * UNIT,
	};
}
function iso([x, y, z], projection) {
	const { origin } = projection;
	const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
	return [
		origin[0] + (x * sinA - y * cosA) * k,
		origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k,
	];
}
function towardViewer(projection) {
	const { sinA, cosA } = cameraOf(projection);
	return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
	const { sinA, cosA, sinE, cosE } = cameraOf(projection);

// Keth bench: the pure model. Everything the figure moves or reads comes from here.
// Sourced facts only (kkrt-labs/keth): body chunks hold 10 txs by default, mpt_diff has 16
// chunks (one per branch of the state trie), and the aggregator chains init, N bodies, teardown
// and the 16 mpt_diff outputs. No timings of the real prover appear anywhere.

const CHUNK = 10;
const BRANCHES = 16;
const SIZES = [10, 20, 30, 40, 50];

const bodiesOf = (txs) => Math.ceil(txs / CHUNK);
/** Segments the aggregator chains: init, bodies, teardown, 16 mpt_diff. */
const chainOf = (txs) => bodiesOf(txs) + 2 + BRANCHES;

/** Bench layout in world units (x along the bench, y across; larger x and y face the viewer). */
const L = {
	X0: -218, // left end of the block strip
	INIT_W: 34,
	BODY_W: 50,
	TEAR_W: 34,
	GAP: 9, // opening of a cut
	CARD_Y: 63, // centre line of the card lane
	CARD_D: 34,
	CARD_TOP: 6.5,
	TRAY_Y: -71,
	SLOT: 12,
	SLOT0: 6, // x of the first mpt slot centre
	TROUGH_Y: -2,
	POCKET: 14, // pitch of the seal pockets
	XR: 168, // x of pocket 0 (right end of the trough)
	POCKETS: 23, // BODIES max 5 + 2 + 16
	PROOF_X: 224,
	BLADE_DX: 7.6, // blade hangs on the near face of the beam
	STAMP_DX: 18, // stamps hang in front of it
	PARK: -226,
	LIFT_BLADE: 8, // how far each tool rests above its working height
	LIFT_STAMP: 10,
};

const COMB_REST = 14;
const RAM_REST = 12;

const cardCount = (txs) => bodiesOf(txs) + 2;
const joinedX = (txs, i) => {
	const B = bodiesOf(txs);
	if (i === 0) return L.X0;
	if (i <= B) return L.X0 + L.INIT_W + L.BODY_W * (i - 1);
	return L.X0 + L.INIT_W + L.BODY_W * B;

const cardWidth = (txs, i) =>
	i === 0 ? L.INIT_W : i === bodiesOf(txs) + 1 ? L.TEAR_W : L.BODY_W;
const cardX = (txs, i, cut = 1) => joinedX(txs, i) + L.GAP * i * cut;
const slotX = (j) => L.SLOT0 + L.SLOT * j;
const pocketX = (p) => L.XR - L.POCKET * p;
/** Pocket of chain index k (init 0, bodies, teardown, then branches 0 to 15). */
const pocketOf = (txs, k) => chainOf(txs) - 1 - k;

const ramp = (t, a, b) => {
	if (t <= a) return 0;
	if (t >= b) return 1;
	const u = (t - a) / (b - a);
	return u * u * (3 - 2 * u);

/** 0 to 1 and back: down over [a, b], held to c, up over [c, d]. */
const pulse = (t, a, b, c, d) => ramp(t, a, b) * (1 - ramp(t, c, d));

/** Build the timeline for a block of `txs` transactions. Pure: state(t) is a function of t only. */
function timeline(txs) {
	const B = bodiesOf(txs);
	const K = B + 2;
	const total = chainOf(txs);
	const gx = [[0, L.PARK]]; // [time, beam x] keyframes
	let t = 0.7;
	const cuts = []; // seam s: blade down, open
	for (let s = 0; s <= B; s++) {
		const seamX = L.X0 + L.INIT_W + L.BODY_W * s + L.GAP * s;
		const beamX = seamX - L.BLADE_DX;
		const prev = gx[gx.length - 1];
		const travel = Math.max(0.45, Math.abs(beamX - prev[1]) / 230);
		gx.push([t + travel, beamX]);

			up: [t + 0.24, t + 0.42],

	for (let j = 0; j < BRANCHES; j++) {
		const x = slotX(j);

		t += travel;

		const up = [t + dur * 0.5, t + dur * 0.85];

			stampB.push([...down, up[0], up[1]]);

				t: down[1],
				src: [slotX(s.slot), L.TRAY_Y, L.CARD_TOP],

	gx.push([landed + 0.4, L.PARK + 20]);
	const combT = landed + 0.45;
	const comb = [combT, combT + 0.6, combT + 1.1, combT + 1.7];
	const keysT = [combT + 0.65, combT + 1.05];
	const pressT = [combT + 1.8, combT + 2.25, combT + 2.4, combT + 2.85];
	const proofT = [combT + 2.2, combT + 2.4];
	const verifyT = [combT + 2.9, combT + 3.3];
	const end = combT + 4.8;
	const fadeOut = [end, end + 0.5];
	const stageAt = (time) => {
		if (time < 0.7) return 'block';
		if (time < cutEnd) {
			const n = cuts.filter((c) => time >= c.hold).length;
			return `cut ${n} of ${B + 1}`;
		}
		if (time < landed + 0.2) return `run ${hits.filter((h) => time >= h.t).length} of ${total}`;
		if (time < pressT[0]) return `chain ${total}`;
		if (time < verifyT[0]) return 'prove';
		return 'verify';
	};
	const gantryAt = (time) => {
		if (time <= gx[0][0]) return gx[0][1];
		for (let i = 1; i < gx.length; i++) {
			if (time <= gx[i][0]) {
				const [t0, x0] = gx[i - 1];
				const [t1, x1] = gx[i];
				return x0 + (x1 - x0) * ramp(time, t0, t1);
			}
		}
		return gx[gx.length - 1][1];

	const focusAt = (time) => {
		const u = Math.min(1, Math.max(0, (gantryAt(time) - L.PARK) / 400));
		return u + (1 - u) * ramp(time, landed + 0.2, landed + 1.2);
	};
	const pulses = (list, time) => list.reduce((m, p) => Math.max(m, pulse(time, ...p)), 0);
	return {
		B,
		K,
		total,
		duration: end + 0.5,
		cutEnd,
		stageAt,
		/** Everything the page draws at time t. All values 0..1 unless noted. */
		at(time) {
			const open = cuts.map((c) => ramp(time, ...c.open));
			const cardShift = (i) => L.GAP * open.slice(0, i).reduce((a, b) => a + b, 0);
			return {
				gantry: gantryAt(time),
				blade: Math.max(0, ...cuts.map((c) => pulse(time, c.down[0], c.down[1], c.up[0], c.up[1]))),
				stampF: pulses(stampF, time),
				stampB: pulses(stampB, time),
				cardShift: Array.from({ length: K }, (_, i) => cardShift(i)),
				stamped: Array.from({ length: K }, (_, i) => {
					const h = hits.find((x) => x.card === i);
					return h ? ramp(time, h.t, h.t + 0.15) : 0;
				}),
				slotStamped: Array.from({ length: BRANCHES }, (_, j) => {
					const h = hits.find((x) => x.slot === j);
					return h ? ramp(time, h.t, h.t + 0.15) : 0;
				}),
				tokens: hits.map((h) => {
					const f = ramp(time, ...h.fly);
					const seen = ramp(time, h.t, h.t + 0.1);
					const arc = Math.sin(Math.PI * f) * 12;
					return {
						k: h.k,
						alpha: seen,
						pos: [
							h.src[0] + (h.dst[0] - h.src[0]) * f,
							h.src[1] + (h.dst[1] - h.src[1]) * f,
							h.src[2] + 1 + (h.dst[2] - h.src[2] - 1) * f + arc,
						],
					};
				}),
				comb: pulse(time, comb[0], comb[1], comb[2], comb[3]),
				keys: ramp(time, ...keysT),
				press: pulse(time, ...pressT),
				proof: ramp(time, ...proofT),
				verified: ramp(time, ...verifyT),
				focus: focusAt(time),
				fade: ramp(time, 0, 0.5) * (1 - ramp(time, ...fadeOut)),
				stage: stageAt(time),
			};
		},
	};
}

function readoutOf(txs, stage) {
	const B = bodiesOf(txs);
	return `${txs} txs · ${B} body · ${stage}`;
}

/** Self-check: node model.mjs */
// biome-ignore lint/complexity/useOptionalChain: `process` is undeclared in the browser
if (typeof process !== 'undefined' && process.argv[1]?.endsWith('model.mjs')) {
	const assert = (c, m) => {
		if (!c) throw new Error(m);
	};
	for (const n of SIZES) {
		const tl = timeline(n);
		assert(tl.B === n / 10, 'bodies');
		assert(tl.total === n / 10 + 18, 'chain');
		const end = tl.at(tl.duration - 0.6);
		assert(end.verified === 1 && end.proof === 1, 'verified at end');
		assert(end.tokens.length === tl.total, 'one seal per segment');
		const pockets = new Set(end.tokens.map((x) => pocketOf(n, x.k)));
		assert(pockets.size === tl.total && Math.max(...pockets) === tl.total - 1, 'pockets unique');
		assert(
			end.tokens.every((x) => x.pos[0] === pocketX(pocketOf(n, x.k))),
			'tokens land in pockets',
		);
	}
	console.log('model ok');
}

// Keth bench: the live page. One loop, writes attributes on refs, stops offscreen.


/**
 * @param root element holding the svg, the range input and the readout
 * @param ctx { P, translateAlong, say(text), motion(): boolean true when motion is allowed }
 */
function mount(root, { P, translateAlong, say, motion, follow }) {
	const svg = root.querySelector('svg');
	const input = root.querySelector('input[type=range]');
	const all = (sel) => [...svg.querySelectorAll(sel)];
	const one = (sel) => svg.querySelector(sel);
	const gantry = all('[data-g="gantry"]');
	const blade = one('[data-g="blade"]');
	const stampF = one('[data-g="stampF"]');
	const stampB = one('[data-g="stampB"]');
	const comb = one('[data-g="comb"]');
	const rams = all('[data-g="ram"]');
	const cards = new Map(all('[data-card]').map((el) => [el.dataset.card, el]));
	const slots = all('[data-slot]');
	const tokens = all('[data-token]');
	const keys = all('[data-key]');
	const pins = all('[data-pin]');
	const fades = all('[data-fade]:not([data-proof])');
	const proof = one('[data-proof]');
	const lit = [...all('[data-proof] .iso-solid'), ...all('[data-lamp] .iso-solid:last-child')];
	const up = (dz) => translateAlong(P, [0, 0, dz]);
	const set = (el, name, value) => {
		if (el.getAttribute(name) !== value) el.setAttribute(name, value);
	};
	const show = (el, on) => {
		if (el.style.display !== (on ? '' : 'none')) el.style.display = on ? '' : 'none';
	};

	let txs = SIZES[Number(input.value)];
	let tl = timeline(txs);
	let t = 0;
	let pending = null;
	let mul = 1;
	let touring = true;
	let tourAt = 0;
	let idleTimer = 0;
	let frame = 0;
	let last = 0;
	let visible = false;
	let saidText = '';
	let held = false; // capture scripts freeze the page with pause()

	const builtX = (index) =>
		index === 0
			? L.X0
			: index === 't'
				? L.X0 + L.INIT_W + L.BODY_W
				: L.X0 + L.INIT_W + L.BODY_W * (index - 1);

	function draw() {
		const s = tl.at(t);
		const f = s.fade * mul;
		for (const el of gantry) set(el, 'transform', translateAlong(P, [s.gantry, 0, 0]));
		set(blade, 'transform', up((1 - s.blade) * L.LIFT_BLADE));
		set(stampF, 'transform', up((1 - s.stampF) * L.LIFT_STAMP));
		set(stampB, 'transform', up((1 - s.stampB) * L.LIFT_STAMP));
		set(comb, 'transform', up((1 - s.comb) * COMB_REST));
		for (const el of rams) set(el, 'transform', up((1 - s.press) * RAM_REST));
		for (const [key, el] of cards) {
			const i = key === 't' ? tl.K - 1 : Number(key);
			const on = key === 't' || i <= tl.B;
			show(el, on);
			if (!on) continue;
			const joined = L.X0 + (i === 0 ? 0 : L.INIT_W + L.BODY_W * (i - 1));
			const home = key === 't' ? L.X0 + L.INIT_W + L.BODY_W * tl.B : joined;
			set(el, 'transform', translateAlong(P, [home - builtX(key) + s.cardShift[i], 0, 0]));
			const imp = el.querySelector('[data-imp]');
			set(imp, 'opacity', String(s.stamped[i].toFixed(2)));
		}
		for (const el of slots) {
			set(
				el.querySelector('[data-imp]'),
				'opacity',
				String(s.slotStamped[el.dataset.slot].toFixed(2)),
			);
		}
		for (const el of tokens) {
			const tok = s.tokens.find((x) => x.k === Number(el.dataset.token));
			show(el, Boolean(tok));
			if (!tok) continue;
			const inner = el.firstElementChild;
			set(inner, 'transform', translateAlong(P, tok.pos));
			set(el, 'opacity', tok.alpha.toFixed(2));
		}
		keys.forEach((el, p) => {
			show(el, p < tl.total - 1);
			set(el, 'opacity', s.keys.toFixed(2));
		});
		pins.forEach((el, p) => {
			show(el, p < tl.total - 1);
		});
		for (const el of fades) set(el, 'opacity', f.toFixed(2));
		set(proof, 'opacity', (s.proof * f).toFixed(2));
		const on = s.verified > 0.5;
		for (const el of lit) {
			if (on) el.setAttribute('data-lit', '');
			else el.removeAttribute('data-lit');
		}
		if (follow) follow(s.focus);
		const text = readoutOf(txs, s.stage);
		if (text !== saidText) {
			saidText = text;
			say(text);
		}
	}

	function restart(n) {
		txs = n;
		tl = timeline(n);
		t = motion() ? 0 : tl.duration - 0.6;
		input.value = String(SIZES.indexOf(n));
		input.setAttribute('aria-valuetext', `${n} transactions`);
	}

	function tick(now) {
		const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
		last = now;
		mul += ((pending ? 0 : 1) - mul) * (1 - Math.exp(-dt / 0.09));
		if (pending && mul < 0.03) {
			restart(pending);
			pending = null;
		}
		t += dt;
		if (t >= tl.duration) {
			if (touring) {
				tourAt = (tourAt + 1) % TOUR.length;
				restart(TOUR[tourAt]);
			} else {
				t = 0;
			}
		}
		draw();
		frame = visible && motion() ? requestAnimationFrame(tick) : 0;
	}
	const TOUR = [30, 50, 20, 40, 10];
	const run = () => {
		if (!frame && visible && motion() && !held) {
			last = 0;
			frame = requestAnimationFrame(tick);
		}
	};
	function pick(n, user) {
		if (user) {
			touring = false;
			clearTimeout(idleTimer);
			idleTimer = setTimeout(() => {
				touring = motion();
				run();
			}, 9000);
		}
		if (!motion()) {
			restart(n);
			draw();
			return;
		}
		if (n !== txs) pending = n;
		run();
	}
	input.addEventListener('input', () => pick(SIZES[Number(input.value)], true));
	new IntersectionObserver(
		(entries) => {
			visible = entries[entries.length - 1].isIntersecting;
			if (visible) run();
		},
		{ rootMargin: '120px 0px' },
	).observe(svg);
	const calmQuery = matchMedia('(prefers-reduced-motion: reduce)');
	calmQuery.addEventListener('change', () => {
		touring = motion();
		restart(txs);
		draw();
		run();
	});
	if (motion()) {
		touring = true;
		restart(TOUR[0]);
	} else {
		touring = false;
		restart(txs);
	}
	draw();
	new ResizeObserver(() => {
		follow?.(tl.at(t).focus, true); // a new width keeps the camera where it was looking
	}).observe(svg);
	// handles for the capture scripts
	root.__keth = {
		seek(n, time) {
			touring = false;
			restart(n);
			t = time;
			for (let i = 0; i < 40; i++) draw(); // lets an eased camera settle
		},
		pause() {
			held = true;
			cancelAnimationFrame(frame);
			frame = 0;
			visible = false;
		},
	};
}

const root = document.querySelector('.keth');
mount(root, { P: {"origin":[381.5986391333043,163.74242059961523],"scale":0.95866976258966,"azimuth":60,"elevation":34}, translateAlong, motion: () => !matchMedia('(prefers-reduced-motion: reduce)').matches,
  say: (text) => { document.querySelector('[data-readout]').textContent = text; } });</script></body></html>
